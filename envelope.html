*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--font);font-weight:400;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(120% 90% at 50% -10%, rgba(255,255,255,.55), transparent 62%),
    radial-gradient(90% 70% at 50% 112%, rgba(154,106,62,.07), transparent 62%);
  background-repeat:no-repeat;
}
::selection{background:rgba(43,39,33,.85);color:var(--paper)}

/* The envelope is pinned while you scroll, so the letter can be drawn out of
   it as you go. The scrollroom below provides the travel. */
.stage{position:relative}
.scene{
  position:sticky;top:0;height:100vh;height:100svh;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:20px;
}
.scrollroom{height:60vh}
.scene .envelope{width:min(86vw,440px)}

/* ================= the envelope ================= */
.envelope{
  position:relative;width:100%;aspect-ratio:1.62;perspective:1500px;
  cursor:pointer;
}
/* the envelope's shadow gets its own static layer. A filter over an animating
   subtree forces the whole thing to be re-rendered every frame — the one thing
   a Helio G99 cannot afford. */
.env-shadow{
  position:absolute;inset:0;border-radius:12px;z-index:-1;pointer-events:none;
  box-shadow:0 18px 28px rgba(58,44,26,.17), 0 3px 7px rgba(58,44,26,.10);
}
/* the back sheet */
.env-back{
  position:absolute;inset:0;border-radius:12px;border:1px solid rgba(43,39,33,.10);
  background-image:var(--tex),linear-gradient(180deg,#fdfaf5,#f6efe4);
  background-size:240px 336px,cover;background-repeat:repeat,no-repeat;
  background-blend-mode:multiply;
}
/* the letter, sitting inside the envelope. Hidden when shut (behind the
   pocket and the flap), it rises out of the mouth when the flap opens. */
.letter-sheet{
  position:absolute;left:6%;width:88%;top:4%;height:92%;border-radius:6px;z-index:1;
  border:1px solid rgba(43,39,33,.10);
  background-image:var(--tex),linear-gradient(#fdfaf6,#f8f2e9);
  background-size:220px 308px,cover;background-repeat:repeat,no-repeat;
  background-blend-mode:multiply;
  box-shadow:0 3px 10px rgba(58,44,26,.10);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:8px;padding:clamp(14px,5vw,30px) clamp(14px,5vw,34px) 0;text-align:center;
  cursor:pointer;will-change:transform;
  transition:transform .62s cubic-bezier(.42,.02,.24,1) 0s;
}
.letter-sheet h1{font-family:var(--display);font-weight:400;font-size:clamp(19px,4.6vw,31px);line-height:1.05;margin:0}
.letter-sheet .rule{width:46%;height:1px;background:var(--hairline)}
.letter-sheet p{font-size:clamp(11.5px,2.7vw,15px);line-height:1.55;color:var(--ink-soft);margin:0;max-width:34ch}
.letter-sheet .sign{font-size:clamp(9px,1.9vw,11px);letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase}

/* the drawn shapes */
.env-svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.env-svg .tex{mix-blend-mode:multiply}
.pocket{z-index:2}
.flap{z-index:3;transform-origin:top center;transform:rotateX(0deg);
  will-change:transform;transition:transform .75s cubic-bezier(.5,.05,.3,1)}

/* the stamp, riding on the flap */
.flap-stamp{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  transform-origin:top center;transform:rotateX(0deg);will-change:transform;
  transition:transform .75s cubic-bezier(.5,.05,.3,1);
}
.stamp{
  position:absolute;left:50%;top:calc(44% + 5px);width:clamp(62px,18%,104px);
  transform:translate(-50%,-50%);padding:0;border:0;background:none;cursor:pointer;
  pointer-events:auto;
  transition:transform .25s ease;
}
.stamp img{display:block;width:100%;height:auto}
.stamp:hover{transform:translate(-50%,-50%) scale(1.05)}
.stamp:active{transform:translate(-50%,-50%) scale(.97)}
.stamp:focus-visible{outline:2px solid var(--earth);outline-offset:5px;border-radius:50%}

/* ================= open ================= */
.envelope.open .flap,
.envelope.open .flap-stamp{transform:rotateX(-172deg)}
/* once the flap has swung past edge-on it drops behind, so the letter can rise
   in front of it — a plain z-index change, no extra compositing */
.envelope.flap-behind .flap,
.envelope.flap-behind .flap-stamp{z-index:0}
/* the flap is no longer lying on the front, so its shadow goes */
.envelope.open .flapshadow{opacity:0}
/* and the letter rises out of the mouth */
.envelope.open .letter-sheet{transform:translateY(-19.35%);transition-delay:.44s}
.flapshadow{transition:opacity .35s ease}

/* ================= the hint ================= */
.hint{display:grid;justify-items:center;gap:7px;color:var(--ink-soft)}
.hint svg{width:36px;height:44px;animation:bob 1.9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.72}50%{transform:translateY(-7px);opacity:1}}
.hint span{font-size:11.5px;letter-spacing:var(--track-caps);text-transform:uppercase}
.hint .open-txt{display:none}
.envelope.open ~ .hint .closed-txt{display:none}
.envelope.open ~ .hint .open-txt{display:block}
.envelope.open ~ .hint svg{opacity:0}

@media (prefers-reduced-motion: reduce){
  .hint svg{animation:none}
  .flap,.flap-stamp{transition-duration:.2s}
  .letter-sheet{transition-duration:.2s;transition-delay:0s!important}
  .flapshadow{transition-duration:.2s}
}
</style>
</head>
<body>

  <div class="scene">
  <div class="envelope" id="envelope">
    <div class="env-shadow"></div>

      <span class="rule"></span>
      <p>A little book of your photographs — made from the pictures you choose.
         Keep it, and add to it whenever you like.</p>
      <span class="sign">a keepsake</span>

  <div class="hint" id="hint">
    <svg viewBox="0 0 60 74" fill="none" stroke="currentColor" stroke-width="2.1"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M30 70 C 36 52, 24 32, 30 14"/>
      <path d="M21 25 L 30 12 L 39 25"/>
    </svg>
    <span class="closed-txt">Press the letter to open</span>
    <span class="open-txt">Scroll to draw the letter out</span>
    </div>
  </div>
  <div class="scrollroom" id="scrollroom" aria-hidden="true"></div>
</div>

<script>
(function () {
  var env = document.getElementById('envelope');
  var stamp = document.getElementById('seal');
  var letter = document.getElementById('letter');
  var scrollroom = document.getElementById('scrollroom');
  var behindTimer = null, settleTimer = null, drawTimer = null, driving = false, ticking = false;

  /* The letter's two resting places, as a percentage of its OWN height:
       -19.35%  out just far enough that 15% of the letter shows
       -104.35% fully out — its bottom clear of the envelope's top edge
     Everything between those two is driven by how far you have scrolled. */
  var RISE_OPEN = -19.35, RISE_FULL = -104.35;

  function applyScroll() {
    ticking = false;
    if (!driving) { return; }
    var room = scrollroom.offsetHeight || 1;
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    var p = y / room; if (p < 0) { p = 0; } if (p > 1) { p = 1; }
    letter.style.transform = 'translateY(' + (RISE_OPEN + (RISE_FULL - RISE_OPEN) * p).toFixed(2) + '%)';
  }
  function onScroll() {
    if (!driving || ticking) { return; }
    ticking = true;
    requestAnimationFrame(applyScroll);   /* one update per frame, at most */
  }

  function openLetter() {
    env.classList.add('open');
    clearTimeout(behindTimer); clearTimeout(settleTimer);
    behindTimer = setTimeout(function () { env.classList.add('flap-behind'); }, 400);
    /* once the letter has settled at 15%, hand it over to the scroll */
    settleTimer = setTimeout(function () {
      driving = true;
      letter.style.transition = 'none';
      applyScroll();
    }, 1150);
  }
  /* Bring the letter the rest of the way out when it is pressed, rather than
     waiting for a scroll. The scene is pinned, so moving the page to the bottom
     does not move what you see — only the letter does. We animate the letter
     and set the scroll to match, so the two stay in step. */
  function drawOut() {
    var room = scrollroom.offsetHeight || 1;
    driving = false;
    window.scrollTo(0, room);
    letter.style.transition = 'transform .55s cubic-bezier(.42,.02,.24,1)';
    void letter.offsetHeight;                       /* flush, so the transition takes */
    letter.style.transform = 'translateY(' + RISE_FULL + '%)';
    clearTimeout(drawTimer);
    drawTimer = setTimeout(function () {
      letter.style.transition = 'none';
      driving = true;
    }, 620);
  }

  function closeLetter() {
    clearTimeout(behindTimer); clearTimeout(settleTimer);
    driving = false;
    env.classList.remove('flap-behind', 'open');
    letter.style.transition = '';
    letter.style.transform = '';
    if ((window.pageYOffset || 0) > 0) { window.scrollTo(0, 0); }   /* instant: the scene is pinned, so nothing appears to jump */
  }

  /* The stamp is the seal: pressing it opens the envelope. */
  stamp.addEventListener('click', function (e) {
    e.stopPropagation();
    openLetter();
  });

  /* The letter is what you press. Pressing it brings it out of the envelope;
     once it is fully out, pressing it again puts it away. */
  letter.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!env.classList.contains('open')) { openLetter(); return; }
    var room = scrollroom.offsetHeight || 1;
    if ((window.pageYOffset || 0) < room - 4) {
      drawOut();          /* bring it the rest of the way out */
    } else {
      closeLetter();      /* it is already out — put it away */
    }
  });

  /* The letter lies inside the envelope, so pressing the envelope anywhere is
     pressing the letter. The stamp stops the tap before it gets here. */
  env.addEventListener('click', function () {
    if (env.classList.contains('open')) { closeLetter(); } else { openLetter(); }
  });

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeLetter(); return; }
    if ((e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') &&
        document.activeElement === stamp) { e.preventDefault(); openLetter(); }
  });
})();
</script>
